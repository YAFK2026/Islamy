<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Egyptian Prayer Time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #0f3d2c;
    --green-mid: #0b5d3b;
    --gold: #c49a3a;
    --gold-soft: #f6efd9;
    --white: #ffffff;
    --line: #e6e1d3;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }

  body {
    background: var(--white);
    color: var(--green);
    font-family: "Tajawal", Tahoma, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 20px 64px;
    gap: 40px;
  }

  /* ---------- header: mosque + title beside it ---------- */
  header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 28px;
    flex-wrap: wrap;
    text-align: left;
  }
  .mosque { width: clamp(150px, 34vw, 210px); height: auto; flex: none; }

  .title small {
    display: block;
    font-size: 1.05rem;
    font-weight: 500;
    color: var(--gold);
    letter-spacing: .12em;
    text-transform: uppercase;
  }
  .title h1 {
    margin: 4px 0 6px;
    font-size: clamp(2rem, 6vw, 3.2rem);
    font-weight: 800;
    line-height: 1.1;
  }
  .title .ar { font-size: 1.25rem; color: var(--green-mid); font-weight: 500; }
  .title .rule {
    width: 90px; height: 3px; margin-top: 14px;
    background: var(--gold); border-radius: 2px;
  }

  /* ---------- checker card ---------- */
  .card {
    width: min(100%, 520px);
    border: 1px solid var(--line);
    border-top: 4px solid var(--gold);
    border-radius: 14px;
    padding: 28px 26px 26px;
    background: var(--white);
    box-shadow: 0 10px 30px rgba(15, 61, 44, .08);
  }
  label { display: block; font-weight: 700; margin-bottom: 10px; }

  .row { display: flex; gap: 10px; }
  input[type="time"] {
    flex: 1;
    min-width: 0;
    font: inherit;
    font-size: 1.3rem;
    padding: 12px 14px;
    color: var(--green);
    border: 1.5px solid var(--line);
    border-radius: 10px;
    background: var(--white);
  }
  input[type="time"]:focus { outline: 2px solid var(--gold); outline-offset: 1px; }

  button {
    font: inherit;
    font-weight: 700;
    padding: 12px 22px;
    border: 0;
    border-radius: 10px;
    background: var(--green-mid);
    color: var(--white);
    cursor: pointer;
  }
  button:hover { background: var(--green); }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .chip {
    padding: 6px 12px;
    font-size: .9rem;
    font-weight: 500;
    background: var(--gold-soft);
    color: var(--green);
    border: 1px solid transparent;
  }
  .chip:hover { background: var(--gold-soft); border-color: var(--gold); }

  #output {
    margin-top: 22px;
    min-height: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    border-radius: 10px;
    background: var(--gold-soft);
    font-size: 1.6rem;
    font-weight: 800;
    text-align: center;
  }
  #output.empty { font-weight: 500; font-size: 1.05rem; color: #7a7355; }
  #output.none  { background: #f3f3f3; color: #666; font-size: 1.2rem; font-weight: 500; }
</style>
</head>
<body>

<header>
  <!-- mosque -->
  <svg class="mosque" viewBox="0 0 200 160" role="img" aria-label="Mosque">
    <!-- ground -->
    <rect x="8" y="140" width="184" height="6" rx="3" fill="#c49a3a"/>

    <!-- minarets -->
    <g fill="#0f3d2c">
      <rect x="20" y="62" width="14" height="78"/>
      <path d="M18 62 L27 34 L36 62 Z"/>
      <rect x="166" y="62" width="14" height="78"/>
      <path d="M164 62 L173 34 L182 62 Z"/>
    </g>
    <g fill="#c49a3a">
      <rect x="15" y="80" width="24" height="4" rx="2"/>
      <rect x="161" y="80" width="24" height="4" rx="2"/>
      <circle cx="27" cy="28" r="3.2"/>
      <circle cx="173" cy="28" r="3.2"/>
    </g>

    <!-- main building -->
    <rect x="44" y="100" width="112" height="40" fill="#0b5d3b"/>

    <!-- main dome -->
    <path d="M58 100 C58 56 84 40 100 40 C116 40 142 56 142 100 Z" fill="#0f3d2c"/>
    <path d="M70 100 C70 68 88 52 100 52" fill="none" stroke="#c49a3a" stroke-width="2" opacity=".8"/>
    <rect x="97" y="26" width="6" height="14" fill="#c49a3a"/>

    <!-- crescent on top -->
    <circle cx="100" cy="17" r="8" fill="#c49a3a"/>
    <circle cx="103.5" cy="15" r="7" fill="#ffffff"/>

    <!-- door -->
    <path d="M88 140 V122 a12 12 0 0 1 24 0 V140 Z" fill="#ffffff"/>
    <!-- side windows -->
    <path d="M56 140 V124 a6 6 0 0 1 12 0 V140 Z" fill="#c49a3a"/>
    <path d="M132 140 V124 a6 6 0 0 1 12 0 V140 Z" fill="#c49a3a"/>
  </svg>

  <div class="title">
    <small>Egyptian</small>
    <h1>Prayer Time</h1>
    <div class="ar">مواقيت الصلاة في مصر</div>
    <div class="rule"></div>
  </div>
</header>

<main class="card">
  <label for="time">Input time</label>
  <div class="row">
    <input type="time" id="time" step="60">
    <button id="check">Check</button>
  </div>

  <div class="chips" aria-label="Quick times">
    <button class="chip" data-t="04:46">4:46</button>
    <button class="chip" data-t="06:15">6:15</button>
    <button class="chip" data-t="11:38">11:38</button>
    <button class="chip" data-t="14:40">14:40</button>
    <button class="chip" data-t="17:02">17:02</button>
    <button class="chip" data-t="18:21">18:21</button>
  </div>

  <div id="output" class="empty" aria-live="polite">Pick a time to see the prayer</div>
</main>

<script>
  const input  = document.getElementById("time");
  const outBox = document.getElementById("output");

  function showPrayer() {
    // input time  (the browser gives "04:46", so the leading zero is removed -> "4:46")
    let time = input.value.replace(/^0/, "");
    let output;

    if (time === "") {
      outBox.className = "empty";
      outBox.textContent = "Pick a time to see the prayer";
      return;
    }

    if (time === "4:46") {
      output = "Fajr prayer: 4:46";
    } else {
      if (time === "6:15") {
        output = "Sunrise: 6:15";
      } else {
        if (time === "11:38") {
          output = "Duhr: 11:38";
        } else {
          if (time === "14:40") {
            output = "Asr: 14:40";
          } else {
            if (time === "17:02") {
              output = "Maghrib: 17:02";
            } else {
              if (time === "18:21") {
                output = "Isha: 18:21";
              } else {
                output = "No prayer at this time";
              }
            }
          }
        }
      }
    }

    outBox.className = output.startsWith("No prayer") ? "none" : "";
    outBox.textContent = output;
  }

  document.getElementById("check").addEventListener("click", showPrayer);
  input.addEventListener("change", showPrayer);

  document.querySelectorAll(".chip").forEach(chip => {
    chip.addEventListener("click", () => {
      input.value = chip.dataset.t;
      showPrayer();
    });
  });
</script>
</body>
</html>
