<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Egyptian Prayer Time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #0f3d2c;
    --green-mid: #0b5d3b;
    --gold: #c49a3a;
    --gold-soft: #f6efd9;
    --white: #ffffff;
    --line: #e6e1d3;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }

  body {
    background: var(--white);
    color: var(--green);
    font-family: "Tajawal", Tahoma, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 20px 64px;
    gap: 40px;
  }

  /* ---------- header: mosque + title beside it ---------- */
  header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 28px;
    flex-wrap: wrap;
    text-align: left;
  }
  .mosque { width: clamp(150px, 34vw, 210px); height: auto; flex: none; }

  .title small {
    display: block;
    font-size: 1.05rem;
    font-weight: 500;
    color: var(--gold);
    letter-spacing: .12em;
    text-transform: uppercase;
  }
  .title h1 {
    margin: 4px 0 6px;
    font-size: clamp(2rem, 6vw, 3.2rem);
    font-weight: 800;
    line-height: 1.1;
  }
  .title .ar { font-size: 1.25rem; color: var(--green-mid); font-weight: 500; }
  .title .rule {
    width: 90px; height: 3px; margin-top: 14px;
    background: var(--gold); border-radius: 2px;
  }

  /* ---------- checker card ---------- */
  .card {
    width: min(100%, 520px);
    border: 1px solid var(--line);
    border-top: 4px solid var(--gold);
    border-radius: 14px;
    padding: 28px 26px 26px;
    background: var(--white);
    box-shadow: 0 10px 30px rgba(15, 61, 44, .08);
  }
  button { font: inherit; border: 0; cursor: pointer; }

  .schedule-title {
    display: flex; align-items: baseline; justify-content: space-between;
    margin: 0 0 12px;
    font-weight: 800; font-size: 1.15rem;
  }
  .schedule-title span { font-size: .85rem; font-weight: 500; color: #7a7355; }

  .schedule { list-style: none; margin: 0 0 26px; padding: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .schedule li + li { border-top: 1px solid var(--line); }

  .slot {
    width: 100%;
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border-radius: 0;
    background: var(--white);
    color: var(--green);
    text-align: left;
    font-weight: 500;
    border-inline-start: 4px solid transparent;
  }
  .slot:hover { background: #fbf8ee; }
  .slot.active { background: var(--gold-soft); border-inline-start-color: var(--gold); }

  .slot .name { font-weight: 700; font-size: 1.1rem; }
  .slot .name em { font-style: normal; font-weight: 500; color: var(--green-mid); margin-inline-start: 8px; font-size: .95rem; }
  .slot .t { text-align: right; line-height: 1.2; }
  .slot .t b { font-size: 1.3rem; font-weight: 800; font-variant-numeric: tabular-nums; }
  .slot .t small { display: block; font-size: .8rem; color: #7a7355; }

  #output {
    margin-top: 22px;
    min-height: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    border-radius: 10px;
    background: var(--gold-soft);
    font-size: 1.6rem;
    font-weight: 800;
    text-align: center;
  }
  #output.empty { font-weight: 500; font-size: 1.05rem; color: #7a7355; }
  #output.none  { background: #f3f3f3; color: #666; font-size: 1.2rem; font-weight: 500; }

  /* ---------- section 2: three buttons ---------- */
  .steps {
    width: min(100%, 900px);
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
  }
  .step {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    min-height: 150px;
    padding: 20px 12px;
    border: 1.5px solid var(--green-mid);
    border-radius: 14px;
    background: var(--white);
    color: var(--green);
    font-weight: 800;
    font-size: 1.35rem;
    line-height: 1.5;
    text-align: center;
    transition: background .15s, color .15s;
  }
  .step .ic {
    width: 58px; height: 58px;
    flex: none;
    display: grid; place-items: center;
    border-radius: 50%;
    background: var(--gold-soft);
    color: var(--green);
    border: 1.5px solid var(--gold);
  }
  .step .ic svg {
    width: 32px; height: 32px;
    fill: none; stroke: currentColor;
    stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
  }
  .step:hover { background: #fbf8ee; }
  .step[aria-pressed="true"] { background: var(--green-mid); color: var(--white); }
  .step[aria-pressed="true"] .ic { background: var(--gold); border-color: var(--gold); color: var(--green); }
  .step:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  /* all four buttons stay in one row on every screen size */
  .step { min-width: 0; }

  @media (max-width: 760px) {
    .steps { gap: 10px; }
    .step { font-size: 1.1rem; padding: 16px 8px; gap: 12px; min-height: 130px; }
    .step .ic { width: 50px; height: 50px; }
    .step .ic svg { width: 28px; height: 28px; }
  }
  @media (max-width: 520px) {
    .steps { gap: 8px; }
    .step { font-size: .88rem; line-height: 1.45; padding: 12px 4px; gap: 10px; min-height: 112px; border-radius: 12px; }
    .step .ic { width: 42px; height: 42px; }
    .step .ic svg { width: 24px; height: 24px; }
  }
  @media (max-width: 360px) {
    .step { font-size: .78rem; }
    .step .ic { width: 36px; height: 36px; }
    .step .ic svg { width: 21px; height: 21px; }
  }
</style>
</head>
<body>

<header>
  <!-- mosque -->
  <svg class="mosque" viewBox="0 0 200 160" role="img" aria-label="Mosque">
    <!-- ground -->
    <rect x="8" y="140" width="184" height="6" rx="3" fill="#c49a3a"/>

    <!-- minarets -->
    <g fill="#0f3d2c">
      <rect x="20" y="62" width="14" height="78"/>
      <path d="M18 62 L27 34 L36 62 Z"/>
      <rect x="166" y="62" width="14" height="78"/>
      <path d="M164 62 L173 34 L182 62 Z"/>
    </g>
    <g fill="#c49a3a">
      <rect x="15" y="80" width="24" height="4" rx="2"/>
      <rect x="161" y="80" width="24" height="4" rx="2"/>
      <circle cx="27" cy="28" r="3.2"/>
      <circle cx="173" cy="28" r="3.2"/>
    </g>

    <!-- main building -->
    <rect x="44" y="100" width="112" height="40" fill="#0b5d3b"/>

    <!-- main dome -->
    <path d="M58 100 C58 56 84 40 100 40 C116 40 142 56 142 100 Z" fill="#0f3d2c"/>
    <path d="M70 100 C70 68 88 52 100 52" fill="none" stroke="#c49a3a" stroke-width="2" opacity=".8"/>
    <rect x="97" y="26" width="6" height="14" fill="#c49a3a"/>

    <!-- crescent on top -->
    <circle cx="100" cy="17" r="8" fill="#c49a3a"/>
    <circle cx="103.5" cy="15" r="7" fill="#ffffff"/>

    <!-- door -->
    <path d="M88 140 V122 a12 12 0 0 1 24 0 V140 Z" fill="#ffffff"/>
    <!-- side windows -->
    <path d="M56 140 V124 a6 6 0 0 1 12 0 V140 Z" fill="#c49a3a"/>
    <path d="M132 140 V124 a6 6 0 0 1 12 0 V140 Z" fill="#c49a3a"/>
  </svg>

  <div class="title">
    <small>Egyptian</small>
    <h1>Prayer Time</h1>
    <div class="ar">مواقيت الصلاة في مصر</div>
    <div class="rule"></div>
  </div>
</header>

<main class="card">
  <div class="schedule-title">Prayer timings <span id="schedule-date">جاري تحميل مواقيت اليوم...</span></div>
  <ul class="schedule">
    <li><button class="slot" data-prayer="Fajr"><div class="name">Fajr <em>الفجر</em></div><div class="t"><b>--:--</b><small>--:--</small></div></button></li>
    <li><button class="slot" data-prayer="Sunrise"><div class="name">Sunrise <em>الشروق</em></div><div class="t"><b>--:--</b><small>--:--</small></div></button></li>
    <li><button class="slot" data-prayer="Dhuhr"><div class="name">Duhr <em>الظهر</em></div><div class="t"><b>--:--</b><small>--:--</small></div></button></li>
    <li><button class="slot" data-prayer="Asr"><div class="name">Asr <em>العصر</em></div><div class="t"><b>--:--</b><small>--:--</small></div></button></li>
    <li><button class="slot" data-prayer="Maghrib"><div class="name">Maghrib <em>المغرب</em></div><div class="t"><b>--:--</b><small>--:--</small></div></button></li>
    <li><button class="slot" data-prayer="Isha"><div class="name">Isha <em>العشاء</em></div><div class="t"><b>--:--</b><small>--:--</small></div></button></li>
  </ul>

  <div id="output" class="empty" aria-live="polite">Tap a prayer to see its time</div>
</main>

<section class="steps" dir="rtl" lang="ar">
  <button class="step" data-n="1" aria-pressed="false"><span class="ic"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 4 C16 4 7 14 7 20 a9 9 0 0 0 18 0 C25 14 16 4 16 4 Z"/><path d="M12 21 a4 4 0 0 0 4 4"/></svg></span>الوضوء</button>
  <button class="step" data-n="2" aria-pressed="false"><span class="ic"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="6" y="4" width="20" height="22" rx="2"/><path d="M11 22 V15 Q11 10 16 7 Q21 10 21 15 V22"/><path d="M10 26 v3 M14 26 v3 M18 26 v3 M22 26 v3"/></svg></span>الصلاة</button>
  <button class="step" data-n="3" aria-pressed="false"><span class="ic"><svg viewBox="0 0 32 32" aria-hidden="true"><g fill="currentColor" stroke="none"><circle cx="24" cy="14" r="2.1"/><circle cx="21.7" cy="19.7" r="2.1"/><circle cx="16" cy="22" r="2.1"/><circle cx="10.3" cy="19.7" r="2.1"/><circle cx="8" cy="14" r="2.1"/><circle cx="10.3" cy="8.3" r="2.1"/><circle cx="16" cy="6" r="2.1"/><circle cx="21.7" cy="8.3" r="2.1"/></g><path d="M16 24.5 V27.5"/><circle cx="16" cy="29" r="1.4"/></svg></span>ما بعد الصلاة</button>
  <button class="step" data-n="4" aria-pressed="false"><span class="ic"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M6 21 V17 a10 10 0 0 1 20 0 V21"/><rect x="4" y="19" width="6" height="9" rx="2.5"/><rect x="22" y="19" width="6" height="9" rx="2.5"/></svg></span>استماع القرآن</button>
</section>


<script>
  const outBox = document.getElementById("output");
  const slots = document.querySelectorAll(".slot");
  const dateLabel = document.getElementById("schedule-date");

  // Prayer times are fetched daily for Cairo, Egypt, using Egypt's calculation method.
  // Africa/Cairo is used to determine the correct local calendar date.
  const prayerNames = {
    Fajr: "Fajr",
    Sunrise: "Sunrise",
    Dhuhr: "Duhr",
    Asr: "Asr",
    Maghrib: "Maghrib",
    Isha: "Isha"
  };

  function egyptToday() {
    const parts = new Intl.DateTimeFormat("en-GB", {
      timeZone: "Africa/Cairo",
      day: "2-digit",
      month: "2-digit",
      year: "numeric"
    }).formatToParts(new Date());

    const part = type => parts.find(item => item.type === type).value;
    return `${part("day")}-${part("month")}-${part("year")}`;
  }

  function formatTime(time) {
    const [hour, minute] = time.split(":").map(Number);
    const suffix = hour >= 12 ? "PM" : "AM";
    const hour12 = hour % 12 || 12;
    return {
      display: `${hour12}:${String(minute).padStart(2, "0")}`,
      detail: `${hour12}:${String(minute).padStart(2, "0")} ${suffix}`
    };
  }

  async function loadPrayerTimes() {
    dateLabel.textContent = "جاري تحميل مواقيت اليوم...";
    try {
      const date = egyptToday();
      const url = `https://api.aladhan.com/v1/timingsByCity/${date}?city=Cairo&country=Egypt&method=5`;
      const response = await fetch(url);
      if (!response.ok) throw new Error("تعذر الاتصال بخدمة مواقيت الصلاة");

      const result = await response.json();
      if (result.code !== 200 || !result.data?.timings) {
        throw new Error("لم تصل بيانات مواقيت الصلاة");
      }

      const timings = result.data.timings;
      slots.forEach(slot => {
        const prayer = slot.dataset.prayer;
        const rawTime = timings[prayer];
        if (!rawTime) return;

        const time = formatTime(rawTime.slice(0, 5));
        slot.dataset.t = rawTime.slice(0, 5);
        slot.querySelector(".t b").textContent = time.display;
        slot.querySelector(".t small").textContent = time.detail;
      });

      dateLabel.textContent = new Intl.DateTimeFormat("ar-EG", {
        timeZone: "Africa/Cairo",
        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric"
      }).format(new Date());
    } catch (error) {
      dateLabel.textContent = "تعذر تحميل المواقيت — تحقق من اتصال الإنترنت";
      console.error("Prayer times error:", error);
    }
  }

  function showPrayer(slot) {
    slots.forEach(button => button.classList.remove("active"));
    slot.classList.add("active");

    const prayer = slot.dataset.prayer;
    const time = slot.dataset.t;
    if (!time) {
      outBox.className = "none";
      outBox.textContent = "مواقيت الصلاة غير متاحة حالياً";
      return;
    }

    const formatted = formatTime(time);
    const englishName = prayerNames[prayer] || prayer;
    outBox.className = "";
    outBox.textContent = `${englishName}: ${formatted.display}`;
  }

  slots.forEach(slot => {
    slot.addEventListener("click", () => showPrayer(slot));
  });

  loadPrayerTimes();

  // Refresh automatically if the date in Egypt changes while the page remains open.
  let lastEgyptDate = egyptToday();
  setInterval(() => {
    const currentEgyptDate = egyptToday();
    if (currentEgyptDate !== lastEgyptDate) {
      lastEgyptDate = currentEgyptDate;
      loadPrayerTimes();
    }
  }, 60000);

  // section 2: one button selected at a time
  const steps = document.querySelectorAll(".step");
  steps.forEach(btn => {
    btn.addEventListener("click", () => {
      steps.forEach(b => b.setAttribute("aria-pressed", b === btn ? "true" : "false"));

      const button = Number(btn.dataset.n);
      if (button >= 1 && button <= 4) {
        setTimeout(() => { window.location.href = `button ${button}.html`; }, 250);
      }
    });
  });
</script>
</body>
</html>
