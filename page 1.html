<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Egyptian Prayer Time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #0f3d2c;
    --green-mid: #0b5d3b;
    --gold: #c49a3a;
    --gold-soft: #f6efd9;
    --white: #ffffff;
    --line: #e6e1d3;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }

  body {
    background: var(--white);
    color: var(--green);
    font-family: "Tajawal", Tahoma, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 20px 64px;
    gap: 40px;
  }

  /* ---------- header: mosque + title beside it ---------- */
  header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 28px;
    flex-wrap: wrap;
    text-align: left;
  }
  .mosque { width: clamp(150px, 34vw, 210px); height: auto; flex: none; }

  .title small {
    display: block;
    font-size: 1.05rem;
    font-weight: 500;
    color: var(--gold);
    letter-spacing: .12em;
    text-transform: uppercase;
  }
  .title h1 {
    margin: 4px 0 6px;
    font-size: clamp(2rem, 6vw, 3.2rem);
    font-weight: 800;
    line-height: 1.1;
  }
  .title .ar { font-size: 1.25rem; color: var(--green-mid); font-weight: 500; }
  .title .rule {
    width: 90px; height: 3px; margin-top: 14px;
    background: var(--gold); border-radius: 2px;
  }

  /* ---------- checker card ---------- */
  .card {
    width: min(100%, 520px);
    border: 1px solid var(--line);
    border-top: 4px solid var(--gold);
    border-radius: 14px;
    padding: 28px 26px 26px;
    background: var(--white);
    box-shadow: 0 10px 30px rgba(15, 61, 44, .08);
  }
  button { font: inherit; border: 0; cursor: pointer; }

  .schedule-title {
    display: flex; align-items: baseline; justify-content: space-between;
    margin: 0 0 12px;
    font-weight: 800; font-size: 1.15rem;
  }
  .schedule-title span { font-size: .85rem; font-weight: 500; color: #7a7355; }

  .schedule { list-style: none; margin: 0 0 26px; padding: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .schedule li + li { border-top: 1px solid var(--line); }

  .slot {
    width: 100%;
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border-radius: 0;
    background: var(--white);
    color: var(--green);
    text-align: left;
    font-weight: 500;
    border-inline-start: 4px solid transparent;
  }
  .slot:hover { background: #fbf8ee; }
  .slot.active { background: var(--gold-soft); border-inline-start-color: var(--gold); }

  .slot .name { font-weight: 700; font-size: 1.1rem; }
  .slot .name em { font-style: normal; font-weight: 500; color: var(--green-mid); margin-inline-start: 8px; font-size: .95rem; }
  .slot .t { text-align: right; line-height: 1.2; }
  .slot .t b { font-size: 1.3rem; font-weight: 800; font-variant-numeric: tabular-nums; }
  .slot .t small { display: block; font-size: .8rem; color: #7a7355; }

  #output {
    margin-top: 22px;
    min-height: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    border-radius: 10px;
    background: var(--gold-soft);
    font-size: 1.6rem;
    font-weight: 800;
    text-align: center;
  }
  #output.empty { font-weight: 500; font-size: 1.05rem; color: #7a7355; }
  #output.none  { background: #f3f3f3; color: #666; font-size: 1.2rem; font-weight: 500; }
</style>
</head>
<body>

<header>
  <!-- mosque -->
  <svg class="mosque" viewBox="0 0 200 160" role="img" aria-label="Mosque">
    <!-- ground -->
    <rect x="8" y="140" width="184" height="6" rx="3" fill="#c49a3a"/>

    <!-- minarets -->
    <g fill="#0f3d2c">
      <rect x="20" y="62" width="14" height="78"/>
      <path d="M18 62 L27 34 L36 62 Z"/>
      <rect x="166" y="62" width="14" height="78"/>
      <path d="M164 62 L173 34 L182 62 Z"/>
    </g>
    <g fill="#c49a3a">
      <rect x="15" y="80" width="24" height="4" rx="2"/>
      <rect x="161" y="80" width="24" height="4" rx="2"/>
      <circle cx="27" cy="28" r="3.2"/>
      <circle cx="173" cy="28" r="3.2"/>
    </g>

    <!-- main building -->
    <rect x="44" y="100" width="112" height="40" fill="#0b5d3b"/>

    <!-- main dome -->
    <path d="M58 100 C58 56 84 40 100 40 C116 40 142 56 142 100 Z" fill="#0f3d2c"/>
    <path d="M70 100 C70 68 88 52 100 52" fill="none" stroke="#c49a3a" stroke-width="2" opacity=".8"/>
    <rect x="97" y="26" width="6" height="14" fill="#c49a3a"/>

    <!-- crescent on top -->
    <circle cx="100" cy="17" r="8" fill="#c49a3a"/>
    <circle cx="103.5" cy="15" r="7" fill="#ffffff"/>

    <!-- door -->
    <path d="M88 140 V122 a12 12 0 0 1 24 0 V140 Z" fill="#ffffff"/>
    <!-- side windows -->
    <path d="M56 140 V124 a6 6 0 0 1 12 0 V140 Z" fill="#c49a3a"/>
    <path d="M132 140 V124 a6 6 0 0 1 12 0 V140 Z" fill="#c49a3a"/>
  </svg>

  <div class="title">
    <small>Egyptian</small>
    <h1>Prayer Time</h1>
    <div class="ar">مواقيت الصلاة في مصر</div>
    <div class="rule"></div>
  </div>
</header>

<main class="card">
  <div class="schedule-title">Prayer timings <span>tap a row to check it</span></div>
  <ul class="schedule">
    <li><button class="slot" data-t="04:46"><div class="name">Fajr <em>الفجر</em></div><div class="t"><b>4:46</b><small>4:46 AM</small></div></button></li>
    <li><button class="slot" data-t="06:15"><div class="name">Sunrise <em>الشروق</em></div><div class="t"><b>6:15</b><small>6:15 AM</small></div></button></li>
    <li><button class="slot" data-t="11:38"><div class="name">Duhr <em>الظهر</em></div><div class="t"><b>11:38</b><small>11:38 AM</small></div></button></li>
    <li><button class="slot" data-t="14:40"><div class="name">Asr <em>العصر</em></div><div class="t"><b>14:40</b><small>2:40 PM</small></div></button></li>
    <li><button class="slot" data-t="17:02"><div class="name">Maghrib <em>المغرب</em></div><div class="t"><b>17:02</b><small>5:02 PM</small></div></button></li>
    <li><button class="slot" data-t="18:21"><div class="name">Isha <em>العشاء</em></div><div class="t"><b>18:21</b><small>6:21 PM</small></div></button></li>
  </ul>

  <div id="output" class="empty" aria-live="polite">Tap a prayer to see its time</div>
</main>

<script>
  const outBox = document.getElementById("output");
  const slots  = document.querySelectorAll(".slot");

  function showPrayer(value) {
    // input time  (the row gives "04:46", so the leading zero is removed -> "4:46")
    let time = value.replace(/^0/, "");
    let output;

    slots.forEach(b => b.classList.remove("active"));

    if (time === "") {
      outBox.className = "empty";
      outBox.textContent = "Tap a prayer to see its time";
      return;
    }

    if (time === "4:46") {
      output = "Fajr prayer: 4:46";
    } else {
      if (time === "6:15") {
        output = "Sunrise: 6:15";
      } else {
        if (time === "11:38") {
          output = "Duhr: 11:38";
        } else {
          if (time === "14:40") {
            output = "Asr: 14:40";
          } else {
            if (time === "17:02") {
              output = "Maghrib: 17:02";
            } else {
              if (time === "18:21") {
                output = "Isha: 18:21";
              } else {
                output = "No prayer at this time";
              }
            }
          }
        }
      }
    }

    outBox.className = output.startsWith("No prayer") ? "none" : "";
    outBox.textContent = output;

    slots.forEach(b => {
      if (b.dataset.t.replace(/^0/, "") === time) b.classList.add("active");
    });
  }

  slots.forEach(slot => {
    slot.addEventListener("click", () => showPrayer(slot.dataset.t));
  });
</script>
</body>
</html>
