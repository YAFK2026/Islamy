<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>استماع القرآن</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #0f3d2c;
    --green-mid: #0b5d3b;
    --gold: #c49a3a;
    --gold-hl: #f0cc5f;
    --gold-soft: #f6efd9;
    --white: #ffffff;
    --line: #e6e1d3;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  body {
    background: var(--white);
    color: var(--green);
    font-family: "Tajawal", Tahoma, Arial, sans-serif;
    overflow: hidden;              /* only the verses area scrolls */
  }

  /* the page is split in two fixed parts: the compact top bar and the verses area */
  .app {
    height: 100vh;
    height: 100dvh;
    max-width: 1000px;
    margin: 0 auto;
    padding: 8px 12px 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  /* ---------- slim title row ---------- */
  .top {
    flex: none;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 8px;
  }
  .back {
    justify-self: start;
    color: var(--green-mid);
    text-decoration: none;
    font-weight: 700;
    font-size: .95rem;
    white-space: nowrap;
  }
  .back:hover { text-decoration: underline; text-decoration-color: var(--gold); }
  .title { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 1.15rem; white-space: nowrap; }
  .title svg { width: 22px; height: 22px; fill: none; stroke: var(--gold); stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  #status {
    justify-self: end;
    text-align: left;
    font-size: .82rem;
    line-height: 1.3;
    font-weight: 500;
    color: #6c6648;
  }

  /* ---------- compact player ---------- */
  .bar {
    flex: none;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    align-items: center;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-top: 3px solid var(--gold);
    border-radius: 12px;
    background: var(--white);
  }
  select {
    width: 100%;
    min-width: 0;
    font: inherit;
    font-size: .98rem;
    padding: 8px 10px;
    color: var(--green);
    background: var(--white);
    border: 1.5px solid var(--line);
    border-radius: 9px;
  }
  select:focus { outline: 2px solid var(--gold); outline-offset: 1px; }

  .transport { grid-column: 1 / -1; display: flex; justify-content: center; align-items: center; gap: 14px; }
  .transport button {
    display: grid; place-items: center;
    width: 38px; height: 38px;
    border-radius: 50%;
    cursor: pointer;
    color: var(--green);
    background: var(--gold-soft);
    border: 1.5px solid var(--gold);
    padding: 0;
  }
  .transport button:hover { background: #efe3bd; }
  .transport button svg { width: 20px; height: 20px; fill: currentColor; }
  .transport #play { width: 48px; height: 48px; background: var(--green-mid); border-color: var(--green-mid); color: var(--white); }
  .transport #play:hover { background: var(--green); }
  .transport #play svg { width: 24px; height: 24px; }
  .transport button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  /* wide screens: everything in one row */
  @media (min-width: 760px) {
    .bar { grid-template-columns: 1.3fr 1fr auto; }
    .transport { grid-column: auto; }
  }

  /* ---------- verses area (own scroll, never covered by the bar) ---------- */
  .reader {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    padding: 14px 14px 28px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: #fffefa;
  }
  #bism {
    text-align: center;
    font-family: "Amiri Quran", "Amiri", "Traditional Arabic", serif;
    font-size: clamp(1.4rem, 1rem + 2vw, 2rem);
    margin: 0 0 10px;
    padding-bottom: 10px;
    border-bottom: 1.5px solid var(--gold);
  }
  #text {
    font-family: "Amiri Quran", "Amiri", "Traditional Arabic", serif;
    font-size: clamp(1.3rem, .9rem + 2.2vw, 2.15rem);   /* scales with the screen width */
    line-height: 2.2;
    text-align: justify;
    text-justify: inter-word;
  }

  .ay { border-radius: 10px; -webkit-box-decoration-break: clone; box-decoration-break: clone; cursor: pointer; }
  .ay.cur { background: var(--gold-soft); }

  .w { border-radius: 7px; padding: 1px 2px; }
  .w.on {
    background: var(--gold-hl);
    color: var(--green);
    box-shadow: 0 0 0 3px var(--gold-hl), 0 0 12px 3px rgba(240, 204, 95, .55);
  }

  .num {
    display: inline-grid; place-items: center;
    min-width: 1.7em; height: 1.7em;
    margin: 0 .25em;
    padding: 0 .25em;
    border: 1.5px solid var(--gold);
    border-radius: 50%;
    color: var(--gold);
    font-family: "Tajawal", Tahoma, sans-serif;
    font-size: .5em;
    font-weight: 700;
    line-height: 1;
    vertical-align: middle;
  }

  .msg { text-align: center; font-family: "Tajawal", Tahoma, sans-serif; font-size: 1.05rem; margin: 20px 0; }
  .msg button {
    font: inherit; font-weight: 700; margin-inline-start: 8px;
    padding: 6px 14px; border: 0; border-radius: 8px; background: var(--green-mid); color: #fff; cursor: pointer;
  }
  .note { text-align: center; color: #8a845f; font-size: .8rem; line-height: 1.8; margin: 18px 0 0; font-family: "Tajawal", Tahoma, sans-serif; }

  @media (max-width: 420px) {
    .title svg { display: none; }
    .reader { padding: 10px 10px 24px; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="top">
    <a class="back" href="page 1.html">→ رجوع</a>
    <div class="title">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M6 21 V17 a10 10 0 0 1 20 0 V21"/><rect x="4" y="19" width="6" height="9" rx="2.5"/><rect x="22" y="19" width="6" height="9" rx="2.5"/></svg>
      استماع القرآن
    </div>
    <div id="status">اضغط تشغيل للبدء</div>
  </div>

  <section class="bar" aria-label="مشغل التلاوة">
    <select id="surah" aria-label="السورة"><option>…</option></select>
    <select id="reciter" aria-label="القارئ"><option value="ar.alafasy">مشاري العفاسي</option></select>

    <div class="transport">
      <button id="prev" aria-label="الآية السابقة">
        <svg viewBox="0 0 32 32"><path d="M10 7 L22 16 L10 25 Z"/><rect x="22" y="7" width="3" height="18" rx="1"/></svg>
      </button>
      <button id="play" aria-label="تشغيل">
        <svg id="icPlay" viewBox="0 0 32 32"><path d="M11 6 L26 16 L11 26 Z"/></svg>
        <svg id="icPause" viewBox="0 0 32 32" hidden><rect x="9" y="7" width="5" height="18" rx="1.5"/><rect x="18" y="7" width="5" height="18" rx="1.5"/></svg>
      </button>
      <button id="next" aria-label="الآية التالية">
        <svg viewBox="0 0 32 32"><path d="M22 7 L10 16 L22 25 Z"/><rect x="7" y="7" width="3" height="18" rx="1"/></svg>
      </button>
    </div>
  </section>

  <main class="reader" id="reader">
    <div id="bism" hidden>بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>
    <div id="text"><p class="msg">جاري التحميل…</p></div>
    <p class="note">
      النص والتلاوة من alquran.cloud. اضغط على أي آية لبدء التلاوة منها.<br>
      تظليل الكلمات يتبع توقيتاً تقريبياً داخل كل آية.
    </p>
  </main>
</div>

<audio id="audio" preload="auto"></audio>

<script>
  // if button4 then show Quran audio page (redirect comes from page 1)

  const API = "https://api.alquran.cloud/v1";
  const $ = id => document.getElementById(id);

  const audio   = $("audio");
  const pre     = new Audio();  pre.preload = "auto";   // preloads the next verse
  const surahSel = $("surah"), reciterSel = $("reciter");
  const textBox = $("text"), bism = $("bism"), statusEl = $("status");

  let surahNo = 1, surahMeta = [];
  let ayahs = [], cur = -1, curWord = -1, raf = 0, token = 0;

  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const ar = n => Number(n).toLocaleString("ar-EG");
  // removes harakat and Quranic marks so only base letters are counted
  const strip = s => s.replace(/[\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g, "");

  const surahName = () => (surahMeta[surahNo - 1] && surahMeta[surahNo - 1].name) || ("سورة " + ar(surahNo));

  /* ---------- text preparation ---------- */
  function splitWords(text) {
    const tokens = text.split(/\s+/).filter(Boolean);
    const words = [];
    let pending = "";
    for (const t of tokens) {
      if (!strip(t)) {                     // stop signs / marks stay attached to a word
        if (words.length) words[words.length - 1].t += " " + t; else pending += t + " ";
      } else {
        words.push({ t: pending + t, len: strip(t).length });
        pending = "";
      }
    }
    return words;
  }

  // the text source puts the basmala in front of verse 1; it is shown as a header instead
  function cleanFirst(text, surah, numInSurah) {
    if (surah !== 1 && numInSurah === 1) {
      const tk = text.split(/\s+/).filter(Boolean);
      if (tk.length > 4 && strip(tk[0]) === "بسم") return tk.slice(4).join(" ");
    }
    return text;
  }

  /* ---------- loading ---------- */
  async function loadSurah(n, startIdx = 0, autoplay = false) {
    const my = ++token;
    surahNo = n;
    surahSel.value = n;
    audio.pause();
    cur = -1; curWord = -1; ayahs = [];
    bism.hidden = true;
    textBox.innerHTML = '<p class="msg">جاري التحميل…</p>';
    setStatus("اضغط تشغيل للبدء");

    try {
      const res = await fetch(`${API}/surah/${n}/editions/quran-uthmani,${reciterSel.value}`);
      if (!res.ok) throw new Error(res.status);
      const json = await res.json();
      if (my !== token) return;

      const tx = json.data[0], au = json.data[1];
      ayahs = tx.ayahs.map((a, i) => {
        const words = splitWords(cleanFirst(a.text, n, a.numberInSurah));
        const total = words.reduce((s, w) => s + w.len + 1.2, 0);
        let acc = 0;
        const cum = words.map(w => (acc += (w.len + 1.2) / total));
        const src = au.ayahs[i].audio || (au.ayahs[i].audioSecondary || [])[0];
        return { num: a.numberInSurah, words, cum, audio: src, els: [], box: null };
      });

      render();
      bism.hidden = (n === 1 || n === 9);
      if (autoplay) playAyah(Math.min(startIdx, ayahs.length - 1));
    } catch (e) {
      if (my !== token) return;
      textBox.innerHTML = '<p class="msg">تعذّر التحميل. تأكد من الاتصال بالإنترنت <button id="retry">أعد المحاولة</button></p>';
      $("retry").onclick = () => loadSurah(n, startIdx, autoplay);
    }
  }

  function render() {
    textBox.textContent = "";
    ayahs.forEach((a, i) => {
      const box = document.createElement("span");
      box.className = "ay"; box.dataset.i = i;
      a.els = a.words.map(w => {
        const s = document.createElement("span");
        s.className = "w"; s.textContent = w.t;
        box.append(s, " ");
        return s;
      });
      const m = document.createElement("span");
      m.className = "num"; m.textContent = ar(a.num);
      box.append(m);
      a.box = box;
      textBox.append(box, " ");
    });
  }

  /* ---------- playback ---------- */
  function setStatus(t) { statusEl.textContent = t; }

  function clearHL() {
    if (cur >= 0 && curWord >= 0 && ayahs[cur]) ayahs[cur].els[curWord].classList.remove("on");
    curWord = -1;
  }

  function playAyah(i) {
    if (!ayahs.length) return;
    if (i >= ayahs.length) return nextSurah();
    if (i < 0) i = 0;

    clearHL();
    if (cur >= 0 && ayahs[cur]) ayahs[cur].box.classList.remove("cur");
    cur = i;
    const a = ayahs[i];
    a.box.classList.add("cur");
    a.box.scrollIntoView({ block: "center", inline: "nearest", behavior: reduceMotion ? "auto" : "smooth" });
    setStatus(`الآية ${ar(a.num)} من ${ar(ayahs.length)}`);

    audio.src = a.audio;
    audio.play().catch(() => {});
    if (ayahs[i + 1]) pre.src = ayahs[i + 1].audio;
  }

  function nextSurah() {
    if (surahNo < 114) loadSurah(surahNo + 1, 0, true);
    else { audio.pause(); setStatus("انتهت التلاوة، صدق الله العظيم"); }
  }

  // moves the gold highlight word by word, using the verse's real audio duration
  function tick() {
    const a = ayahs[cur];
    // real duration when the browser knows it, otherwise an estimate from the word lengths
    const real = audio.duration;
    const d = (real && isFinite(real)) ? real : (a ? a.words.reduce((x, w) => x + w.len + 1.2, 0) * 0.13 : 0);
    if (a && d) {
      const t = Math.min(Math.max((audio.currentTime / d - 0.03) / 0.94, 0), 1);
      let k = a.cum.findIndex(c => t <= c);
      if (k < 0) k = a.words.length - 1;
      if (k !== curWord) {
        if (curWord >= 0) a.els[curWord].classList.remove("on");
        a.els[k].classList.add("on");
        curWord = k;
      }
    }
    raf = requestAnimationFrame(tick);
  }

  audio.addEventListener("play", () => {
    $("icPlay").hidden = true; $("icPause").hidden = false;
    $("play").setAttribute("aria-label", "إيقاف مؤقت");
    cancelAnimationFrame(raf); raf = requestAnimationFrame(tick);
  });
  audio.addEventListener("pause", () => {
    $("icPlay").hidden = false; $("icPause").hidden = true;
    $("play").setAttribute("aria-label", "تشغيل");
    cancelAnimationFrame(raf);
  });
  audio.addEventListener("ended", () => playAyah(cur + 1));
  audio.addEventListener("error", () => { if (audio.getAttribute("src")) setStatus("تعذّر تشغيل الصوت، جرّب قارئاً آخر"); });

  /* ---------- controls ---------- */
  $("play").onclick = () => {
    if (cur < 0) playAyah(0);
    else if (audio.paused) audio.play();
    else audio.pause();
  };
  $("next").onclick = () => playAyah(cur < 0 ? 0 : cur + 1);
  $("prev").onclick = () => playAyah(cur > 0 ? cur - 1 : 0);

  textBox.addEventListener("click", e => {
    const box = e.target.closest(".ay");
    if (box) playAyah(Number(box.dataset.i));
  });

  surahSel.onchange = () => loadSurah(Number(surahSel.value), 0, !audio.paused);
  reciterSel.onchange = () => loadSurah(surahNo, Math.max(cur, 0), !audio.paused);

  /* ---------- start ---------- */
  async function init() {
    try {
      const j = await (await fetch(`${API}/surah`)).json();
      surahMeta = j.data;
      surahSel.innerHTML = surahMeta.map(s => `<option value="${s.number}">${ar(s.number)}. ${s.name}</option>`).join("");
    } catch (e) {
      surahSel.innerHTML = Array.from({ length: 114 }, (_, i) => `<option value="${i + 1}">سورة رقم ${ar(i + 1)}</option>`).join("");
    }

    try {
      const j = await (await fetch(`${API}/edition?format=audio&language=ar&type=versebyverse`)).json();
      if (j.data && j.data.length) {
        reciterSel.innerHTML = j.data.map(e => `<option value="${e.identifier}">${e.name || e.englishName}</option>`).join("");
        if ([...reciterSel.options].some(o => o.value === "ar.alafasy")) reciterSel.value = "ar.alafasy";
      }
    } catch (e) { /* keeps the default reciter */ }

    loadSurah(1);
  }
  init();
</script>
</body>
</html>
