<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مرحباً</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 24px;
    box-sizing: border-box;
    background: #fdfbf7;
    color: #222;
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    text-align: center;
  }
  #logo { max-width: 220px; width: 60%; height: auto; }
  #welcome {
    font-size: 1.5rem;
    line-height: 2;
    max-width: 700px;
    white-space: pre-line;   /* keeps the line breaks of the message */
    min-height: 6em;
  }
  #welcome::after {          /* blinking cursor */
    content: "|";
    margin-inline-start: 2px;
    animation: blink 0.8s steps(1) infinite;
  }
  #welcome.done::after { content: ""; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>

<img id="logo" src="logo.jpeg" alt="Logo">
<div id="welcome"></div>

<script>
  // start website: always 1
  let start = 1;

  const message =
"السلام عليكم ورحمة الله وبركاته..\n" +
"أسعد الله أوقاتكم بكل خير، وحفظكم من كل سوء، وجعل يومكم مباركاً مليئاً بالطمأنينة والسلام.";

  const target = document.getElementById("welcome");

  if (start === 1) {
    let i = 0;
    const speed = 100; // ms per character

    function type() {
      if (i < message.length) {
        target.textContent += message.charAt(i);
        i++;
        setTimeout(type, speed);
      } else {
        target.classList.add("done");
        // redirect to a new empty page after typing finishes
        setTimeout(() => { window.location.href = "page 1.html"; }, 2000);
      }
    }
    type();
  }
</script>
</body>
</html>
