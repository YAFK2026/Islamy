<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مرحباً</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #0b5d3b;
    --gold: #d4af37;
    --white: #ffffff;
  }

  html, body { height: 100%; margin: 0; }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 24px;
    box-sizing: border-box;
    background: var(--green);
    color: var(--white);
    font-family: "Tajawal", Tahoma, Arial, sans-serif;
    text-align: center;
  }

  .logo-wrap {
    padding: 12px;
    border-radius: 50%;
    background: var(--white);
  }
  #logo {
    display: block;
    width: clamp(110px, 28vw, 150px);
    height: clamp(110px, 28vw, 150px);
    object-fit: contain;
    border-radius: 50%;
  }

  /* line - eight-pointed star - line */
  .divider {
    display: flex;
    align-items: center;
    gap: 14px;
    width: min(70vw, 340px);
  }
  .divider::before, .divider::after {
    content: "";
    flex: 1;
    height: 1.5px;
    background: var(--gold);
  }
  .divider svg { width: 26px; height: 26px; flex: none; }

  #welcome {
    font-size: clamp(1.7rem, 6vw, 2.8rem);
    font-weight: 700;
    line-height: 1.9;
    min-height: 2em;
    white-space: pre-line;
  }
  #welcome::after {
    content: "";
    display: inline-block;
    width: 3px;
    height: 1em;
    margin-inline-start: 6px;
    vertical-align: middle;
    background: var(--gold);
    animation: blink .8s steps(1) infinite;
  }
  #welcome.done::after { display: none; }
  @keyframes blink { 50% { opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    #welcome::after { animation: none; }
  }
</style>
</head>
<body>

<div class="logo-wrap"><img id="logo" src="logo.jpeg" alt="Logo"></div>

<div class="divider" aria-hidden="true">
  <svg viewBox="0 0 24 24" fill="none" stroke="#d4af37" stroke-width="1.6" stroke-linejoin="miter">
    <rect x="5" y="5" width="14" height="14"/>
    <rect x="5" y="5" width="14" height="14" transform="rotate(45 12 12)"/>
  </svg>
</div>

<div id="welcome"></div>

<script>
  // start website: always 1
  let start = 1;

  const message =
"السلام عليكم ورحمة الله وبركاته";

  const target = document.getElementById("welcome");

  if (start === 1) {
    let i = 0;
    const speed = 100; // ms per character

    function type() {
      if (i < message.length) {
        target.textContent += message.charAt(i);
        i++;
        setTimeout(type, speed);
      } else {
        target.classList.add("done");
        // redirect to a new empty page after typing finishes
        setTimeout(() => { window.location.href = "page 1.html"; }, 2000);
      }
    }
    type();
  }
</script>
</body>
</html>
